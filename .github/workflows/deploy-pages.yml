name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _site
          cp README.md ipsj-lualatex.cls _site/
          cp bibsample.bib ebibsample.bib ipsjunsrt-e.bst  ipsjunsrt.bst _site/
          cp ipsj.cls ipsjpref.sty ipsjsort-e.bst ipsjsort.bst ipsjtech.sty _site/
          cp ses-ipsj.cls ses.sty _site/
          cp jsample.tex jsample.pdf _site/
          cp jsample-lualatex.tex jsample-lualatex.pdf _site/
          cp esample.tex esample.pdf _site/
          cp esample-lualatex.tex esample-lualatex.pdf _site/
          cp tech-jsample.tex tech-jsample.pdf _site/
          cp tech-jsample-lualatex.tex tech-jsample-lualatex.pdf _site/
          cp ses-sample.tex ses-sample.pdf _site/
          cp ses-sample-lualatex.tex ses-sample-lualatex.pdf _site/
          cp ses-esample.tex ses-esample.pdf _site/
          cp ses-esample-lualatex.tex ses-esample-lualatex.pdf _site/

      - uses: actions/configure-pages@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
