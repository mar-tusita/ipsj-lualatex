name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'README.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _src/_includes
          cp README.md _src
          echo "theme: minima" > _src/_config.yml
          echo "title: LuaLaTeXに対応する情報処理学会（IPSJ）の論文・研究報告用スタイルファイル" >> _src/_config.yml
          echo "titles_from_headings:" >> _src/_config.yml
          echo "  enabled: false" >> _src/_config.yml
          echo "" > _src/_includes/header.html
          echo "" > _src/_includes/footer.html

      - name: Put additional documents
        run: |
          cp ipsj-lualatex.cls _src/
          cp bibsample.bib ebibsample.bib ipsjunsrt-e.bst  ipsjunsrt.bst _src/
          cp ipsj.cls ipsjpref.sty ipsjsort-e.bst ipsjsort.bst ipsjtech.sty _src/
          cp ses-ipsj.cls ses.sty _src/
          cp jsample.tex jsample.pdf _src/
          cp jsample-lualatex.tex jsample-lualatex.pdf _src/
          cp esample.tex esample.pdf _src/
          cp esample-lualatex.tex esample-lualatex.pdf _src/
          cp tech-jsample.tex tech-jsample.pdf _src/
          cp tech-jsample-lualatex.tex tech-jsample-lualatex.pdf _src/
          cp ses-sample.tex ses-sample.pdf _src/
          cp ses-sample-lualatex.tex ses-sample-lualatex.pdf _src/
          cp ses-esample.tex ses-esample.pdf _src/
          cp ses-esample-lualatex.tex ses-esample-lualatex.pdf _src/

      # https://github.com/actions/configure-pages
      - uses: actions/configure-pages@v6

      # https://github.com/actions/jekyll-build-pages
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_src
          verbose: true

      - run: ls -lR ./_site
  
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # https://github.com/actions/deploy-pages
      - uses: actions/deploy-pages@v5
        id: deployment